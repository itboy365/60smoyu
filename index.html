<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>60s 摸鱼看板 · 打工人每日速览</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    :root {
        --bg: #f8fafc;
    }
    * { -webkit-tap-highlight-color: transparent; }

    body {
        background-color: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
    }
    /* 柔和渐变背景 */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
            radial-gradient(circle at 12% 15%, rgba(99, 102, 241, 0.10), transparent 42%),
            radial-gradient(circle at 88% 8%, rgba(236, 72, 153, 0.09), transparent 42%),
            radial-gradient(circle at 50% 95%, rgba(34, 197, 94, 0.07), transparent 45%),
            linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
        pointer-events: none;
    }

    /* 玻璃拟态头部 */
    .glass-header {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }

    /* 卡片 */
    .card {
        background: #fff;
        border-radius: 16px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px -8px rgba(15, 23, 42, 0.10), 0 4px 12px -4px rgba(15, 23, 42, 0.05);
    }
    .card-header {
        padding: 14px 18px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }
    .card-body { padding: 4px 18px 18px; flex: 1; }
    .card-icon {
        width: 30px; height: 30px;
        border-radius: 9px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: #fff;
        flex-shrink: 0;
        box-shadow: 0 2px 6px -1px rgba(0,0,0,0.12);
    }
    .card-title { font-weight: 700; color: #0f172a; font-size: 14.5px; letter-spacing: 0.01em; }

    /* 卡片网格 */
    .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 16px;
        align-items: start;
    }

    /* Tab 切换 */
    .tabs {
        display: inline-flex;
        gap: 2px;
        background: #f1f5f9;
        border-radius: 9px;
        padding: 3px;
    }
    .tab-btn {
        padding: 4px 11px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        color: #64748b;
        border: none;
        background: transparent;
        cursor: pointer;
        transition: all 0.18s ease;
        white-space: nowrap;
    }
    .tab-btn:hover { color: #334155; }
    .tab-btn.active {
        background: #fff;
        color: #0f172a;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    /* 骨架屏 */
    .skeleton-line {
        height: 8px;
        background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 63%);
        background-size: 400% 100%;
        border-radius: 4px;
        animation: shimmer 1.4s ease infinite;
    }
    @keyframes shimmer {
        0% { background-position: 100% 50%; }
        100% { background-position: 0 50%; }
    }

    /* 刷新按钮 */
    .icon-btn {
        width: 28px; height: 28px;
        border-radius: 8px;
        display: inline-flex; align-items: center; justify-content: center;
        color: #94a3b8;
        background: transparent;
        border: none;
        cursor: pointer;
        transition: all 0.18s;
    }
    .icon-btn:hover { color: #3b82f6; background: #eff6ff; }

    /* 倒计时数字 */
    .countdown-num {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
    }

    /* 列表项 */
    .list-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 7px 0;
        border-bottom: 1px dashed #f1f5f9;
        font-size: 13.5px;
        line-height: 1.55;
        color: #334155;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .idx {
        font-size: 11px;
        font-weight: 700;
        color: #94a3b8;
        min-width: 16px;
        text-align: center;
        margin-top: 2px;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
    }
    .list-item .idx.top1 { color: #ef4444; }
    .list-item .idx.top2 { color: #f97316; }
    .list-item .idx.top3 { color: #eab308; }

    /* 热度 */
    .hot-num {
        font-size: 11px;
        color: #94a3b8;
        flex-shrink: 0;
        align-self: center;
        font-variant-numeric: tabular-nums;
    }

    /* 一言 */
    .quote-box {
        position: relative;
        padding: 14px 4px 6px;
    }
    .quote-mark {
        font-family: Georgia, serif;
        font-size: 56px;
        line-height: 1;
        color: #ddd6fe;
        position: absolute;
        top: 0; left: -4px;
        user-select: none;
    }

    /* 天气 */
    .weather-temp {
        font-size: 34px;
        font-weight: 800;
        color: #0f172a;
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }

    /* 必应壁纸卡片 */
    .bing-card {
        position: relative;
        min-height: 180px;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: flex-end;
        color: #fff;
        text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        transition: transform 0.3s ease;
    }
    .bing-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.7) 100%);
    }
    .bing-card > * { position: relative; z-index: 1; }

    /* 进度条 */
    .progress-track {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: #f1f5f9;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 1s ease;
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* 页脚 */
    .footer {
        background: #0a0a0a;
        color: #94a3b8;
        padding: 22px 0;
        text-align: center;
        font-size: 13px;
        border-top: 1px solid #1a1a1a;
    }
    .footer a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
    }
    .footer a:hover { color: #fff; text-decoration: underline; }

    /* 响应式 */
    @media (max-width: 640px) {
        .card-header { padding: 12px 14px 8px; }
        .card-body { padding: 2px 14px 14px; }
        .cards-grid { gap: 12px; grid-template-columns: 1fr; }
        .hide-sm { display: none; }
    }

    /* 淡入 */
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.45s ease-out; }
</style>
</head>
<body class="text-slate-800">

<!-- ========== 头部 ========== -->
<header class="glass-header sticky top-0 z-50">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2 flex-shrink-0">
            <span class="text-xl">🐟</span>
            <h1 class="text-[15px] font-bold tracking-tight text-slate-900">60s 摸鱼看板</h1>
        </div>

        <!-- 中间：天气 + 日期（大屏显示） -->
        <div id="header-info" class="hidden md:flex items-center gap-3 text-xs text-slate-500 flex-1 justify-center">
            <span id="hdr-weather" class="flex items-center gap-1">
                <span class="text-slate-400">加载中...</span>
            </span>
            <span class="text-slate-300">·</span>
            <span id="hdr-date" class="font-medium text-slate-600"></span>
            <span class="text-slate-300 hide-sm">·</span>
            <span id="hdr-lunar" class="text-slate-400 hide-sm"></span>
        </div>

        <!-- 右侧：倒计时 -->
        <div class="flex items-center gap-3 text-xs flex-shrink-0">
            <div id="hdr-countdown" class="flex items-center gap-3 text-slate-600">
                <span class="flex items-center gap-1">
                    <span class="text-slate-400 text-[11px]">距下班</span>
                    <span class="countdown-num text-indigo-600">--:--:--</span>
                </span>
                <span class="text-slate-300 hide-sm">·</span>
                <span class="flex items-center gap-1 hide-sm">
                    <span class="text-slate-400 text-[11px]">距周末</span>
                    <span class="countdown-num text-emerald-600" id="hdr-weekend">--天</span>
                </span>
            </div>
            <span class="text-slate-300 hide-sm">|</span>
            <span id="refresh-status" class="text-emerald-500 hide-sm">● 自动刷新</span>
        </div>
    </div>
</header>

<!-- ========== 主内容 ========== -->
<main class="max-w-[1400px] mx-auto px-4 sm:px-6 py-6">
    <div id="cards" class="cards-grid"></div>
</main>

<footer class="footer">
    <p>© <a href="https://news.itboy.pw" target="_blank">下一页更精彩 →</a></p>
    <p class="mt-1.5 text-[11px] text-slate-600">数据来源：<a href="https://docs.60s-api.viki.moe" target="_blank">60s API</a></p>
</footer>

<script>
/* ============================================================
   配置
============================================================ */
const API_BASE = 'https://api.itboy.pw';
const REFRESH_INTERVAL = 10 * 60 * 1000;
const LS = {
    oilRegion:   'dash:oilRegion',
    weatherCity: 'dash:weatherCity',
    hotTab:      'dash:hotTab',
    marketTab:   'dash:marketTab',
    funTab:      'dash:funTab',
};

const state = {
    oilRegion:   localStorage.getItem(LS.oilRegion)   || '北京',
    weatherCity: localStorage.getItem(LS.weatherCity) || '北京',
    hotTab:      localStorage.getItem(LS.hotTab)      || 'weibo',
    marketTab:   localStorage.getItem(LS.marketTab)   || 'oil',
    funTab:      localStorage.getItem(LS.funTab)      || 'duanzi',
};

const abortMap = new Map();

/* ============================================================
   工具函数
============================================================ */
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function saveState(key, val) { localStorage.setItem(key, val); }

/* ============================================================
   卡片定义
============================================================ */
const CARDS = [
    {
        id: 'moyu',
        name: '摸鱼日报',
        icon: '🐟',
        color: 'linear-gradient(135deg,#06b6d4,#0891b2)',
        type: 'moyu',
        url: '/v2/moyu',
        refreshable: false,
        span: 1,
    },
    {
        id: 'news',
        name: '60s 读懂世界',
        icon: '🌍',
        color: 'linear-gradient(135deg,#3b82f6,#2563eb)',
        type: 'news',
        url: '/v2/60s',
        refreshable: true,
        span: 1,
    },
    {
        id: 'hot',
        name: '实时热搜',
        icon: '🔥',
        color: 'linear-gradient(135deg,#f43f5e,#e11d48)',
        type: 'hot',
        refreshable: true,
        hasTabs: 'hot',
        span: 1,
    },
    {
        id: 'weather',
        name: '今日天气',
        icon: '🌤️',
        color: 'linear-gradient(135deg,#38bdf8,#0ea5e9)',
        type: 'weather',
        refreshable: true,
        span: 1,
    },
    {
        id: 'market',
        name: '行情速览',
        icon: '📈',
        color: 'linear-gradient(135deg,#10b981,#059669)',
        type: 'market',
        refreshable: true,
        hasTabs: 'market',
        span: 1,
    },
    {
        id: 'history',
        name: '历史上的今天',
        icon: '📅',
        color: 'linear-gradient(135deg,#f59e0b,#d97706)',
        type: 'history',
        url: '/v2/today-in-history',
        refreshable: false,
        span: 1,
    },
    {
        id: 'quote',
        name: '一言',
        icon: '💬',
        color: 'linear-gradient(135deg,#a855f7,#7c3aed)',
        type: 'quote',
        url: '/v2/hitokoto',
        refreshable: true,
        span: 1,
    },
    {
        id: 'fun',
        name: '摸鱼充电站',
        icon: '😄',
        color: 'linear-gradient(135deg,#f97316,#ea580c)',
        type: 'fun',
        refreshable: true,
        hasTabs: 'fun',
        span: 1,
    },
    {
        id: 'bing',
        name: '必应每日壁纸',
        icon: '🖼️',
        color: 'linear-gradient(135deg,#64748b,#334155)',
        type: 'bing',
        url: '/v2/bing',
        refreshable: true,
        isFullImage: true,
        span: 1,
    },
];

const TABS = {
    hot: [
        { id: 'weibo', name: '微博', url: '/v2/weibo' },
        { id: 'baidu', name: '百度', url: '/v2/baidu/hot' },
        { id: 'zhihu', name: '知乎', url: '/v2/zhihu' },
    ],
    market: [
        { id: 'oil',      name: '油价', url: '/v2/fuel-price' },
        { id: 'gold',     name: '金价', url: '/v2/gold-price' },
        { id: 'exchange', name: '汇率', url: '/v2/exchange-rate' },
    ],
    fun: [
        { id: 'duanzi', name: '段子',   url: '/v2/duanzi' },
        { id: 'joke',   name: '冷笑话', url: '/v2/dad-joke' },
        { id: 'answer', name: '答案之书', url: '/v2/answer' },
    ],
};

/* ============================================================
   启动
============================================================ */
document.addEventListener('DOMContentLoaded', () => {
    buildCards();
    refreshAll();
    startHeaderClock();
    startAutoRefresh();
});

function buildCards() {
    const wrap = document.getElementById('cards');
    wrap.innerHTML = CARDS.map(c => cardShell(c)).join('');

    // 绑定 tab 事件
    Object.keys(TABS).forEach(group => {
        document.querySelectorAll(`[data-tabgroup="${group}"] .tab-btn`).forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.tab;
                if (group === 'hot')    { state.hotTab = val;    saveState(LS.hotTab, val); }
                if (group === 'market') { state.marketTab = val; saveState(LS.marketTab, val); }
                if (group === 'fun')    { state.funTab = val;    saveState(LS.funTab, val); }
                // 高亮
                btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // 重新加载该卡片
                const cardId = group === 'hot' ? 'hot' : group === 'market' ? 'market' : 'fun';
                loadCard(CARDS.find(c => c.id === cardId));
            });
        });
    });
}

function cardShell(card) {
    const tabsHtml = card.hasTabs ? renderTabs(card.hasTabs) : '';
    return `
        <div class="card fade-up" id="card-${card.id}" data-cardid="${card.id}">
            <div class="card-header">
                <div class="flex items-center gap-2 min-w-0">
                    <div class="card-icon" style="background:${card.color}">${card.icon}</div>
                    <div class="card-title truncate">${escapeHtml(card.name)}</div>
                </div>
                <div class="flex items-center gap-1.5 flex-shrink-0">
                    ${tabsHtml}
                    ${card.refreshable ? `
                    <button class="icon-btn" onclick="manualRefresh('${card.id}')" title="刷新">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>` : ''}
                </div>
            </div>
            <div class="card-body" id="body-${card.id}">
                ${skeleton(card.type)}
            </div>
        </div>`;
}

function renderTabs(group) {
    const list = TABS[group];
    const active = group === 'hot' ? state.hotTab : group === 'market' ? state.marketTab : state.funTab;
    return `<div class="tabs" data-tabgroup="${group}">
        ${list.map(t => `<button class="tab-btn ${t.id === active ? 'active' : ''}" data-tab="${t.id}">${t.name}</button>`).join('')}
    </div>`;
}

function skeleton(type) {
    if (type === 'bing') {
        return `<div class="bing-card rounded-xl bg-slate-100 animate-pulse" style="min-height:180px"></div>`;
    }
    return `
        <div class="space-y-3 py-2">
            <div class="skeleton-line w-3/4"></div>
            <div class="skeleton-line w-full"></div>
            <div class="skeleton-line w-5/6"></div>
            <div class="skeleton-line w-2/3"></div>
        </div>`;
}

/* ============================================================
   数据加载
============================================================ */
function refreshAll() {
    CARDS.forEach(loadCard);
}

function startAutoRefresh() {
    setInterval(() => {
        CARDS.filter(c => c.refreshable).forEach(loadCard);
    }, REFRESH_INTERVAL);
}

window.manualRefresh = function(id) {
    const card = CARDS.find(c => c.id === id);
    if (!card) return;
    document.getElementById(`body-${id}`).innerHTML = skeleton(card.type);
    loadCard(card);
};

async function loadCard(card) {
    const body = document.getElementById(`body-${card.id}`);
    if (!body) return;

    // 解析实际请求的 URL
    let url = card.url;
    let params = {};

    if (card.type === 'hot') {
        const tab = TABS.hot.find(t => t.id === state.hotTab) || TABS.hot[0];
        url = tab.url;
    } else if (card.type === 'market') {
        const tab = TABS.market.find(t => t.id === state.marketTab) || TABS.market[0];
        url = tab.url;
        if (tab.id === 'oil') params.region = state.oilRegion;
    } else if (card.type === 'fun') {
        const tab = TABS.fun.find(t => t.id === state.funTab) || TABS.fun[0];
        url = tab.url;
    } else if (card.type === 'weather') {
        url = '/v2/weather/realtime';
        params.city = state.weatherCity;
    }

    if (!url) {
        body.innerHTML = `<div class="text-center text-slate-400 text-sm py-4">暂无数据源</div>`;
        return;
    }

    // 中断上一次
    if (abortMap.has(card.id)) {
        abortMap.get(card.id).abort();
        abortMap.delete(card.id);
    }
    const ctrl = new AbortController();
    abortMap.set(card.id, ctrl);
    const timer = setTimeout(() => ctrl.abort(), 9000);

    const qs = new URLSearchParams({ ...params, t: Date.now() }).toString();

    try {
        const res = await fetch(`${API_BASE}${url}?${qs}`, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const data = json.data !== undefined ? json.data : json;
        renderCard(card, data, body);
    } catch (e) {
        clearTimeout(timer);
        if (e.name !== 'AbortError') {
            body.innerHTML = errorHtml(card.id);
        }
    } finally {
        abortMap.delete(card.id);
    }
}

function errorHtml(id) {
    return `
        <div class="flex flex-col items-center justify-center py-6 text-slate-400">
            <svg class="w-7 h-7 mb-2 text-red-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <p class="text-xs">加载失败</p>
            <button onclick="manualRefresh('${id}')" class="mt-2 text-xs text-blue-500 hover:underline">点击重试</button>
        </div>`;
}

/* ============================================================
   渲染分发
============================================================ */
function renderCard(card, data, body) {
    switch (card.type) {
        case 'moyu':    return renderMoyu(data, body);
        case 'news':    return renderNews(data, body);
        case 'hot':     return renderHot(data, body);
        case 'weather': return renderWeather(data, body);
        case 'market':  return renderMarket(data, body);
        case 'history': return renderHistory(data, body);
        case 'quote':   return renderQuote(data, body);
        case 'fun':     return renderFun(data, body);
        case 'bing':    return renderBing(data, body);
    }
}

/* ============================================================
   1. 摸鱼日报
============================================================ */
function renderMoyu(data, body) {
    const date = data.date || {};
    const progress = data.progress || {};
    const nextHoliday = data.nextHoliday || {};
    const nextWeekend = data.nextWeekend || {};
    const weekday = date.weekday || '';
    const mood = moodText(weekday, nextWeekend.daysUntil);
    const quote = data.moyuQuote || '好好工作，努力摸鱼。';

    const bar = (label, val, color) => `
        <div class="mb-2.5">
            <div class="flex justify-between text-[11px] mb-1">
                <span class="text-slate-500">${escapeHtml(label)}</span>
                <span class="font-bold text-slate-700">${Number(val) || 0}%</span>
            </div>
            <div class="progress-track">

/* ============================================================

============================================================ */
function renderHot(data, body) {
    const list = normalizeList(data);
    if (!list.length) {
        body.innerHTML = `<div class="text-center text-slate-400 text-sm py-6">暂无热搜</div>`;
        return;
    }
    body.innerHTML = `
        <div class="fade-up">
            <ul>
                ${list.slice(0, 12).map((item, i) => {
                    const title = item.title || item.name || item.word || item.query || '';
                    const hot = item.hot || item.hotValue || item.heat || item.num || '';
                    const url = item.url || item.link || item.mobilUrl || '#';
                    const rank = i + 1;
                    const cls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
                    return `
                        <li class="list-item">
                            <span class="idx ${cls}">${rank}</span>
                            <a href="${escapeHtml(url)}" target="_blank" rel="noopener"
                               class="flex-1 hover:text-rose-600 transition-colors line-clamp-2">${escapeHtml(title)}</a>
                            ${hot ? `<span class="hot-num">${formatHot(hot)}</span>` : ''}
                        </li>`;
                }).join('')}
            </ul>
        </div>`;
}

function normalizeList(data) {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.list)) return data.list;
    if (data && Array.isArray(data.data)) return data.data;
    if (data && Array.isArray(data.items)) return data.items;
    return [];
}

function formatHot(n) {
    const num = Number(n);
    if (!isFinite(num)) return String(n);
    if (num >= 100000000) return (num / 100000000).toFixed(1) + '亿';
    if (num >= 10000) return (num / 10000).toFixed(1) + '万';
    return String(num);
}

function weatherEmoji(w) {
    if (!w) return '🌤️';
    if (w.includes('雷')) return '⛈️';
    if (w.includes('雪')) return '❄️';
    if (w.includes('雨')) return '🌧️';
    if (w.includes('阴')) return '☁️';
    if (w.includes('云') || w.includes('多云')) return '⛅';
    if (w.includes('晴')) return '☀️';
    if (w.includes('雾') || w.includes('霾')) return '🌫️';
    return '🌤️';
}

/* ============================================================
   头部时钟（下班倒计时 + 周末倒计时 + 日期）
============================================================ */
function startHeaderClock() {
    // 日期
    const now = new Date();
    const weekMap = ['周日','周一','周二','周三','周四','周五','周六'];
    document.getElementById('hdr-date').textContent =
        `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())} ${weekMap[now.getDay()]}`;

    // 每秒更新
    tickHeader();
    setInterval(tickHeader, 1000);
}

function tickHeader() {
    const now = new Date();
    const cdEl = document.querySelector('#hdr-countdown .countdown-num');
    const offEl = cdEl;
    const wkEl = document.getElementById('hdr-weekend');

    // 下班倒计时
    const off = new Date(now);
    off.setHours(18, 0, 0, 0);
    if (now < off && now.getHours() >= 9) {
        const diff = off - now;
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        offEl.textContent = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
        offEl.classList.remove('text-emerald-600');
        offEl.classList.add('text-indigo-600');
    } else {
        offEl.textContent = '已下班 🎉';
        offEl.classList.remove('text-indigo-600');
        offEl.classList.add('text-emerald-600');
    }

    // 周末倒计时
    const day = now.getDay(); // 0=日 1=一 ... 6=六
    let daysToWeekend;
    if (day === 0) daysToWeekend = 6;
    else if (day === 6) daysToWeekend = 0;
    else daysToWeekend = 6 - day;

    wkEl.textContent = daysToWeekend === 0 ? '今天 🎊' : `${daysToWeekend}天`;
}
